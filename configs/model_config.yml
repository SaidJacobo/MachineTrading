logistic_regression:
  model: 'sklearn.linear_model.LogisticRegression'
  param_grid:
    'stacking__prob_transf__model__penalty': ['l1', 'l2']          # Tipo de penalización (default: 'l2')
    'stacking__prob_transf__model__solver': ['liblinear', 'saga', 'lbfgs']    # Método del solucionador (default: 'lbfgs')
    'stacking__prob_transf__model__max_iter': [100, 200, 300]         # Número máximo de iteraciones (default: 100)
    'stacking__prob_transf__model__fit_intercept': [True, False]   # Ajuste del intercepto (default: True)

random_forest:
  model: 'sklearn.ensemble.RandomForestClassifier'
  param_grid:
    'stacking__prob_transf__model__n_estimators': [3, 10, 50, 100, 200]   # Número de árboles en el bosque (default: 100)
    'stacking__prob_transf__model__max_depth': [3, 5, 8, None]        # Profundidad máxima de los árboles (default: None)
    'stacking__prob_transf__model__min_samples_split': [2, 5, 10]  # Número mínimo de muestras requeridas para dividir un nodo (default: 2)
    'stacking__prob_transf__model__min_samples_leaf': [1, 2, 4]    # Número mínimo de muestras requeridas en cada hoja (default: 1)

gradient_boosting:
  model: 'xgboost.XGBClassifier'
  param_grid:
    "stacking__prob_transf__model__objective": ['binary:logistic']              # Objetivo (default: 'binary:logistic')
    "stacking__prob_transf__model__max_depth": [2, 5, 8, 3]                     # Profundidad máxima (default: 3)
    "stacking__prob_transf__model__n_estimators": [5, 10, 20, 30, 40, 50, 70, 100, 100]  # Número de estimadores (default: 100)
    "stacking__prob_transf__model__learning_rate": [0.05, 0.01, 0.1]       # Tasa de aprendizaje (default: 0.1)

neural_network:
  model: 'sklearn.neural_network.MLPClassifier'
  param_grid:
    "stacking__prob_transf__model__hidden_layer_sizes": 
      - [3,]
      - [5,]
      - [10,]
      - [50,] 
      - [100,]
    "stacking__prob_transf__model__activation": ['relu', 'tanh', 'logistic', 'relu']  # Activación (default: 'relu')
    "stacking__prob_transf__model__solver": ['sgd', 'adam', 'adam']            # Solucionador (default: 'adam')
    "stacking__prob_transf__model__alpha": [0.0001, 0.001, 0.01, 0.0001]       # Tasa de regularización (default: 0.0001)
